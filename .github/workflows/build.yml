name: JingjiaAgent source builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the four owned images after checks
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend tests
        working-directory: backend
        run: go test ./...
      - name: Frontend tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Standalone release contract
        working-directory: runtime/jingjiaagent
        run: python3 -m unittest test_release_bundle
      - name: Build owned images from source
        run: |
          python3 runtime/jingjiaagent/build.py --no-prepare
          python3 runtime/jingjiaagent/build_web.py
      - name: Publish only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 runtime/jingjiaagent/publish_images.py --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
