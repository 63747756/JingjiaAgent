name: JingjiaAgent source builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the five owned images after checks
        type: boolean
        default: false
      release_version:
        description: Optional signed deployment bundle version (manual runs only)
        type: string
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend tests
        working-directory: backend
        run: go test ./...
      - name: Installer tests
        working-directory: installer
        run: go test ./...
      - name: Frontend tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Standalone release contract
        working-directory: runtime/jingjiaagent
        run: python3 -m unittest test_release_bundle test_deployment_package test_office_runtime
      - name: Build owned images from source
        run: |
          python3 runtime/jingjiaagent/build.py --no-prepare
          python3 runtime/jingjiaagent/build_web.py
      - name: Guest tools and office delivery without internet
        run: |
          GUEST_IMAGE="$(python3 -c 'import json; d=json.load(open("runtime/jingjiaagent/source.lock.json")); print("jingjiaagent-guest:"+d["commit"][:7]+"-p"+str(d["guest_patch_revision"]))')"
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" /opt/office/venv/bin/python /src/tests/guest_offline_smoke.py
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" python3 /src/tests/browser_offline_smoke.py
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" python3 -m unittest discover -s /src/patches -p 'opencode*_test.py'
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" python3 /src/tests/test_opencode_long_prompt.py
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" python3 /src/tests/test_opencode_config.py
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" python3 /src/tests/test_opencode_sse.py
          docker run --rm --network none --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" python3 /src/tests/test_sdk_control.py
          docker run --rm --network none --env JINGJIAAGENT_DEPENDENCY_NETWORK_NONE=1 --env JINGJIAAGENT_DEPENDENCY_IMAGE_READY=1 --mount "type=bind,source=$PWD/runtime/jingjiaagent,target=/src,readonly" "$GUEST_IMAGE" /opt/office/venv/bin/python /src/tests/test_dependency_runtime.py
          docker run --rm --network none --mount "type=bind,source=$PWD/backend/pkg/runtimeadapter/guest,target=/tests,readonly" "$GUEST_IMAGE" python3 /tests/terminal_test.py
      - name: Publish only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 runtime/jingjiaagent/publish_images.py --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
      - name: Build signed online and offline deployment materials
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SIGNING_KEY: ${{ secrets.DEPLOYMENT_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/jingjiaagent-release.key"
          trap 'rm -f "$RUNNER_TEMP/jingjiaagent-release.key"' EXIT
          python3 runtime/jingjiaagent/build_storage.py
          for image in postgres:16-alpine redis:7-alpine clickhouse/clickhouse-server:25.8-alpine; do docker pull "$image"; done
          python3 runtime/jingjiaagent/package_deployment.py --version "$RELEASE_VERSION" --key "$RUNNER_TEMP/jingjiaagent-release.key" --output "$RUNNER_TEMP/jingjiaagent-release" --archive
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        with:
          name: jingjiaagent-deployment
          path: ${{ runner.temp }}/jingjiaagent-release.tar.gz
          compression-level: 0
          retention-days: 7
