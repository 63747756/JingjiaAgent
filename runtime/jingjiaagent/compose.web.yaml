# Independent Linux acceptance stack. Credentials and immutable image IDs are
# supplied by prepare_linux_web.py in ignored .state/linux-web.
services:
  postgres:
    networks: [business]
    image: ${JINGJIAAGENT_WEB_POSTGRES_IMAGE:?Immutable PostgreSQL image required}
    pull_policy: never
    environment:
      POSTGRES_DB: jingjiaagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JINGJIAAGENT_WEB_POSTGRES_PASSWORD:?Private password required}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jingjiaagent"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    networks: [business]
    image: ${JINGJIAAGENT_WEB_REDIS_IMAGE:?Immutable Redis image required}
    pull_policy: never
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets: [redis_password]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    networks: [business]
    image: ${JINGJIAAGENT_WEB_STORAGE_IMAGE:?Immutable S3 image required}
    pull_policy: never
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${JINGJIAAGENT_WEB_STORAGE_USER:?Private storage user required}
      MINIO_ROOT_PASSWORD: ${JINGJIAAGENT_WEB_STORAGE_PASSWORD:?Private storage password required}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:47424
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  clickhouse:
    networks: [business]
    image: ${JINGJIAAGENT_WEB_CLICKHOUSE_IMAGE:?Immutable ClickHouse image required}
    pull_policy: never
    environment:
      CLICKHOUSE_DB: jingjiaagent
      CLICKHOUSE_USER: jingjiaagent
      CLICKHOUSE_PASSWORD: ${JINGJIAAGENT_WEB_CLICKHOUSE_PASSWORD:?Private ClickHouse password required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    mem_limit: 2g
    cpus: 2
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 40
  runtime:
    # Upstream selects a daemon network for every new Guest. Keep exactly one:
    # network ordering/priority cannot safely select a multi-homed daemon's net.
    networks: [sandbox]
    image: ${JINGJIAAGENT_RUNTIME_DAEMON_IMAGE:?Immutable daemon image required}
    pull_policy: never
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export AGENT_COMPOSE_AUTH_TOKEN="$$(cat /run/secrets/runtime_token)"
        exec /usr/bin/tini -- /usr/local/bin/agent-compose daemon
    environment:
      RUNTIME_DRIVER: docker
      DATA_ROOT: /data
      SANDBOX_ROOT: /data/sandboxes
      HTTP_LISTEN: 0.0.0.0:7410
      AGENT_COMPOSE_RUNTIME_BASE_URL: http://runtime:7410
      DEFAULT_IMAGE: ${JINGJIAAGENT_RUNTIME_GUEST_IMAGE:?Immutable Guest image required}
      DOCKER_DEFAULT_IMAGE: ${JINGJIAAGENT_RUNTIME_GUEST_IMAGE}
      SANDBOX_START_TIMEOUT: 2m
      SANDBOX_STOP_TIMEOUT: 30s
    secrets: [runtime_token]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "runtime-data:/data"]
    ports: ["127.0.0.1:47418:7410"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,urllib.request; r=urllib.request.Request('http://127.0.0.1:7410/agentcompose.v2.ProjectService/ListProjects',data=b'{\"limit\":1}',headers={'Content-Type':'application/json','Authorization':'Bearer '+pathlib.Path('/run/secrets/runtime_token').read_text().strip()}); urllib.request.urlopen(r,timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    networks: [business, sandbox]
    image: ${JINGJIAAGENT_WEB_BACKEND_IMAGE:?Immutable backend image required}
    pull_policy: never
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      runtime: {condition: service_healthy}
      runtime-proxy: {condition: service_started}
      storage: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    volumes: ["${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/config:/app/config:ro", "backend-data:/app/data"]
    secrets:
      - runtime_token
      - payload_key
      - source: ad_secret_key
        target: ad-secret-key-source
    environment:
      JINGJIAAGENT_AD_SECRET_KEY_FILE: /run/secrets/ad-secret-key
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:47424:47424", "127.0.0.1:47425:47425"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8888/api/v1/users/oidc/default-team"]
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    image: ${JINGJIAAGENT_WEB_FRONTEND_IMAGE:?Immutable JingjiaAgent frontend image required}
    pull_policy: never
    network_mode: service:backend
    depends_on:
      backend: {condition: service_healthy}
    volumes: ["${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  runtime-proxy:
    networks: [sandbox]
    image: ${JINGJIAAGENT_WEB_NGINX_IMAGE:?Immutable proxy image required}
    pull_policy: never
    depends_on:
      runtime: {condition: service_healthy}
    volumes: ["${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/runtime-proxy.conf:/etc/nginx/conf.d/default.conf:ro", "${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/runtime.crt:/run/tls/server.crt:ro", "${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/runtime.key:/run/tls/server.key:ro"]
    ports: ["127.0.0.1:47419:7411"]
secrets:
  redis_password: {file: "${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/redis.password"}
  runtime_token: {file: "${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/daemon.token"}
  payload_key: {file: "${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/payload.key"}
  ad_secret_key: {file: "${JINGJIAAGENT_WEB_STATE_DIRECTORY:-.state/linux-web}/ad-secret.key"}
volumes:
  postgres-data:
  redis-data:
  storage-data:
  backend-data:
  runtime-data:
  clickhouse-data:
# Business stores have no sandbox interface. Only the trusted backend/Web
# namespace bridges application requests; it is not an IP router.
networks:
  sandbox:
    driver: bridge
  business:
    driver: bridge
    internal: true
