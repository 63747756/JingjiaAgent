# Independent Linux acceptance stack. Credentials and immutable image IDs are
# supplied by prepare_linux_web.py in ignored .state/linux-web.
services:
  postgres:
    image: ${WEB_POSTGRES_IMAGE:?Immutable PostgreSQL image required}
    pull_policy: never
    environment:
      POSTGRES_DB: monkeycode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WEB_POSTGRES_PASSWORD:?Private password required}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:47594:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monkeycode"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: ${WEB_REDIS_IMAGE:?Immutable Redis image required}
    pull_policy: never
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: ${WEB_STORAGE_IMAGE:?Immutable S3 image required}
    pull_policy: never
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${WEB_STORAGE_USER:?Private storage user required}
      MINIO_ROOT_PASSWORD: ${WEB_STORAGE_PASSWORD:?Private storage password required}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:47424
    volumes: ["storage-data:/data"]
    ports: ["127.0.0.1:47596:9000", "127.0.0.1:47597:9001"]
  clickhouse:
    image: ${WEB_CLICKHOUSE_IMAGE:?Immutable ClickHouse image required}
    pull_policy: never
    environment:
      CLICKHOUSE_DB: monkeycode
      CLICKHOUSE_USER: monkeycode
      CLICKHOUSE_PASSWORD: ${WEB_CLICKHOUSE_PASSWORD:?Private ClickHouse password required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    mem_limit: 2g
    cpus: 2
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 40
  runtime:
    image: ${RUNTIME_DAEMON_IMAGE:?Immutable daemon image required}
    pull_policy: never
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export AGENT_COMPOSE_AUTH_TOKEN="$$(cat /run/secrets/runtime_token)"
        exec /usr/bin/tini -- /usr/local/bin/agent-compose daemon
    environment:
      RUNTIME_DRIVER: docker
      DATA_ROOT: /data
      SANDBOX_ROOT: /data/sandboxes
      HTTP_LISTEN: 0.0.0.0:7410
      AGENT_COMPOSE_RUNTIME_BASE_URL: http://runtime:7410
      DEFAULT_IMAGE: ${RUNTIME_GUEST_IMAGE:?Immutable Guest image required}
      DOCKER_DEFAULT_IMAGE: ${RUNTIME_GUEST_IMAGE}
      SANDBOX_START_TIMEOUT: 2m
      SANDBOX_STOP_TIMEOUT: 30s
    secrets: [runtime_token]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "runtime-data:/data"]
    ports: ["127.0.0.1:47418:7410"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,urllib.request; r=urllib.request.Request('http://127.0.0.1:7410/agentcompose.v2.ProjectService/ListProjects',data=b'{\"limit\":1}',headers={'Content-Type':'application/json','Authorization':'Bearer '+pathlib.Path('/run/secrets/runtime_token').read_text().strip()}); urllib.request.urlopen(r,timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    image: ${WEB_BACKEND_IMAGE:?Immutable backend image required}
    pull_policy: never
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      runtime: {condition: service_healthy}
      runtime-proxy: {condition: service_started}
      storage: {condition: service_started}
      clickhouse: {condition: service_healthy}
    volumes: ["${WEB_STATE_DIRECTORY:-.state/linux-web}/config:/app/config:ro", "backend-data:/app/data"]
    secrets: [runtime_token, payload_key]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:47424:47424", "127.0.0.1:47425:47425"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8888/api/v1/users/oidc/default-team"]
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    image: ${WEB_NGINX_IMAGE:?Immutable web image required}
    pull_policy: never
    network_mode: service:backend
    depends_on:
      backend: {condition: service_healthy}
    volumes: ["${WEB_STATE_DIRECTORY:-.state/linux-web}/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "${WEB_STATIC_DIRECTORY:-.build/web-static}:/usr/share/nginx/html:ro"]
  runtime-proxy:
    image: ${WEB_NGINX_IMAGE:?Immutable proxy image required}
    pull_policy: never
    depends_on:
      runtime: {condition: service_healthy}
    volumes: ["${WEB_STATE_DIRECTORY:-.state/linux-web}/runtime-proxy.conf:/etc/nginx/conf.d/default.conf:ro", "${WEB_STATE_DIRECTORY:-.state/linux-web}/runtime.crt:/run/tls/server.crt:ro", "${WEB_STATE_DIRECTORY:-.state/linux-web}/runtime.key:/run/tls/server.key:ro"]
    ports: ["127.0.0.1:47419:7411"]
secrets:
  runtime_token: {file: "${WEB_STATE_DIRECTORY:-.state/linux-web}/daemon.token"}
  payload_key: {file: "${WEB_STATE_DIRECTORY:-.state/linux-web}/payload.key"}
volumes:
  postgres-data:
  redis-data:
  storage-data:
  backend-data:
  runtime-data:
  clickhouse-data:
